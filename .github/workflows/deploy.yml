name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Provenance-verify the bundled data, then run unit tests as a gate.
      - run: npm test
      # Browser regression + accessibility + offline gate (spec §13/§14). These
      # run against the production build (vite preview) via playwright.config.js.
      # Chromium + Firefox cover the core workflow, offline relaunch, and the
      # worker pipeline; the WebKit-offline caveat is documented and skipped.
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- --project=chromium --project=firefox
      # Build with the correct base path for a project Pages site
      # (served from /<repo>/), producing dist/.
      - run: npm run build -- --base=/open-accessibility-workbench/
      # SPA fallback: copy index.html to 404.html so deep hash routes and
      # unknown paths still load the app shell.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
